<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咨询管理后台 | 瀚加日财务咨询</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "微软雅黑", system-ui, sans-serif;
  background: #f5f4f0; color: #1c2733; line-height: 1.6;
}
.topbar {
  background: #0d2b45; color: #fff; padding: 16px 28px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 10;
}
.topbar h1 { font-size: 18px; font-weight: 700; }
.topbar h1 span { color: #d4b483; }
.topbar a {
  color: #d4b483; text-decoration: none; font-size: 14px; border: 1px solid rgba(212,180,131,.5);
  padding: 6px 14px; border-radius: 6px; transition: all .2s;
}
.topbar a:hover { background: rgba(212,180,131,.15); }
.container { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
.toolbar {
  display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;
}
.toolbar .count { font-size: 14px; color: #5c6b7a; }
.toolbar .count b { color: #0d2b45; font-size: 18px; }
.btn {
  padding: 9px 18px; border-radius: 6px; border: 0; cursor: pointer;
  font-size: 13px; font-weight: 600; font-family: inherit; transition: all .2s;
}
.btn-export { background: #0d2b45; color: #fff; }
.btn-export:hover { background: #14406b; }
.btn-clear { background: #fff; color: #c0392b; border: 1px solid #e0d8cc; }
.btn-clear:hover { background: #fdf1f1; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: #fff; border-radius: 10px; padding: 20px 24px;
  box-shadow: 0 2px 12px rgba(13,43,69,.06);
}
.stat-card .num { font-size: 28px; font-weight: 700; color: #0d2b45; }
.stat-card .lbl { font-size: 13px; color: #5c6b7a; margin-top: 4px; }
table {
  width: 100%; background: #fff; border-radius: 10px; overflow: hidden;
  box-shadow: 0 2px 12px rgba(13,43,69,.06); border-collapse: collapse;
}
th {
  background: #0d2b45; color: #fff; text-align: left; padding: 12px 16px;
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
td {
  padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #f0ece4; vertical-align: top;
}
tr:hover td { background: #faf8f3; }
td.msg { max-width: 320px; white-space: pre-wrap; }
td.time { white-space: nowrap; color: #5c6b7a; font-size: 12px; }
.empty {
  text-align: center; padding: 60px 20px; color: #5c6b7a; background: #fff;
  border-radius: 10px; box-shadow: 0 2px 12px rgba(13,43,69,.06);
}
.empty .big { font-size: 48px; margin-bottom: 12px; }
.del-btn {
  background: none; border: 1px solid #e0d8cc; color: #c0392b; border-radius: 4px;
  padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; transition: all .2s;
}
.del-btn:hover { background: #fdf1f1; border-color: #c0392b; }
.note {
  margin-top: 20px; font-size: 12px; color: #8a97a5; background: #fff;
  border: 1px dashed #e0d8cc; border-radius: 8px; padding: 14px 18px;
}
/* ===== 登录界面 ===== */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #0a2240 0%, #0d2b45 55%, #0e3a63 100%);
  padding: 20px;
}
.login-box {
  background: #fff; border-radius: 14px; padding: 44px 40px; width: 100%; max-width: 380px;
  box-shadow: 0 24px 60px rgba(0,0,0,.35);
}
.login-box h2 { font-size: 20px; color: #0d2b45; margin-bottom: 6px; }
.login-box .sub { font-size: 13px; color: #8a97a5; margin-bottom: 28px; }
.login-box label { display: block; font-size: 13px; color: #1c2733; margin-bottom: 6px; }
.login-box input {
  width: 100%; padding: 12px 14px; border: 1px solid #e0d8cc; border-radius: 8px;
  font-size: 14px; font-family: inherit; margin-bottom: 18px; transition: border .2s;
}
.login-box input:focus { outline: none; border-color: #b8935a; }
.login-btn {
  width: 100%; padding: 13px; background: #0d2b45; color: #fff; border: 0;
  border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  transition: background .2s;
}
.login-btn:hover { background: #14406b; }
.login-err { color: #c0392b; font-size: 13px; margin-top: 12px; text-align: center; min-height: 20px; }
.login-box .lock { font-size: 36px; text-align: center; margin-bottom: 12px; }
@media (max-width: 768px) {
  .stats { grid-template-columns: 1fr; }
  .container { padding: 0 12px; }
  th, td { padding: 10px 12px; }
  td.msg { max-width: 180px; }
  .topbar { padding: 14px 16px; }
}
</style>
</head>
<body>
<!-- 登录界面 -->
<div class="login-wrap" id="loginView">
  <div class="login-box">
    <div class="lock">🔒</div>
    <h2>后台登录</h2>
    <div class="sub">瀚加日财务咨询 · 咨询管理</div>
    <form id="loginForm">
      <label>账号</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="请输入账号">
      <label>密码</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="请输入密码">
      <button type="submit" class="login-btn">登 录</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- 管理界面 -->
<div id="adminApp" style="display:none;">
<div class="topbar">
  <h1>瀚加日 <span>咨询管理后台</span></h1>
  <div style="display:flex;gap:10px;align-items:center;">
    <a href="#" onclick="toggleAccounts();return false;" style="border-color:rgba(212,180,131,.5);color:#d4b483;">👥 账号管理</a>
    <span style="font-size:13px;color:rgba(255,255,255,.7);" id="loginName"></span>
    <a href="#" onclick="logout();return false;" style="border-color:rgba(192,57,43,.6);color:#e8a09b;">退出</a>
  </div>
</div>
<div class="container">
  <div class="toolbar">
    <span class="count">共 <b id="totalCount">0</b> 条咨询</span>
    <button class="btn btn-export" onclick="exportCSV()">导出 CSV</button>
    <button class="btn btn-clear" onclick="clearAll()">清空全部</button>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">咨询总数</div></div>
    <div class="stat-card"><div class="num" id="statToday">0</div><div class="lbl">今日新增</div></div>
    <div class="stat-card"><div class="num" id="statContact">0</div><div class="lbl">留下电话的客户</div></div>
  </div>

  <!-- 账号管理面板 -->
  <div id="accountsPanel" style="display:none;background:#fff;border-radius:10px;padding:24px;box-shadow:0 2px 12px rgba(13,43,69,.06);margin-bottom:24px;">
    <h3 style="color:#0d2b45;font-size:16px;margin-bottom:16px;">👥 账号管理</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div style="border:1px solid #f0ece4;border-radius:8px;padding:16px;">
        <h4 style="font-size:14px;color:#0d2b45;margin-bottom:12px;">创建新账号</h4>
        <label style="font-size:12px;color:#5c6b7a;display:block;margin-bottom:4px;">用户名</label>
        <input id="newUser" type="text" placeholder="新账号" style="width:100%;padding:9px 12px;border:1px solid #e0d8cc;border-radius:6px;font-size:13px;margin-bottom:10px;font-family:inherit;">
        <label style="font-size:12px;color:#5c6b7a;display:block;margin-bottom:4px;">密码</label>
        <input id="newPass" type="password" placeholder="新密码" style="width:100%;padding:9px 12px;border:1px solid #e0d8cc;border-radius:6px;font-size:13px;margin-bottom:12px;font-family:inherit;">
        <button class="btn btn-export" onclick="createAccount()">创建账号</button>
        <div id="createMsg" style="font-size:12px;margin-top:8px;min-height:16px;"></div>
      </div>
      <div style="border:1px solid #f0ece4;border-radius:8px;padding:16px;">
        <h4 style="font-size:14px;color:#0d2b45;margin-bottom:12px;">修改密码</h4>
        <label style="font-size:12px;color:#5c6b7a;display:block;margin-bottom:4px;">选择账号</label>
        <select id="pwdUser" style="width:100%;padding:9px 12px;border:1px solid #e0d8cc;border-radius:6px;font-size:13px;margin-bottom:10px;font-family:inherit;"></select>
        <label style="font-size:12px;color:#5c6b7a;display:block;margin-bottom:4px;">新密码</label>
        <input id="pwdNew" type="password" placeholder="新密码" style="width:100%;padding:9px 12px;border:1px solid #e0d8cc;border-radius:6px;font-size:13px;margin-bottom:12px;font-family:inherit;">
        <button class="btn btn-export" onclick="changePassword()">修改密码</button>
        <div id="pwdMsg" style="font-size:12px;margin-top:8px;min-height:16px;"></div>
      </div>
    </div>
    <div style="margin-top:20px;">
      <h4 style="font-size:14px;color:#0d2b45;margin-bottom:10px;">现有账号</h4>
      <div id="accountList"></div>
    </div>
  </div>
  <div id="tableWrap"></div>
  <div class="note">
    💡 <b>说明</b>：咨询数据保存在浏览器本地（localStorage），仅供演示/单机管理。
    如需多设备实时查看，可接入后端服务（如 Formspree 邮件通知、Google Sheets 或自建 API）。
  </div>
</div>
</div>

<script>
// ===== 账号管理（存 localStorage，可创建账号/改密码）=====
const DEFAULT_USER = 'admin';
const DEFAULT_PASS = 'hanjiari2026';
const ACCOUNTS_KEY = 'hanjiari_admin_accounts';
const SESSION_KEY = 'hanjiari_admin_session';

// 读取账号列表，无则初始化默认账号
function getAccounts() {
  try {
    const raw = localStorage.getItem(ACCOUNTS_KEY);
    if (raw) {
      const list = JSON.parse(raw);
      if (Array.isArray(list) && list.length) return list;
    }
  } catch (e) {}
  const def = [{ user: DEFAULT_USER, pass: DEFAULT_PASS, created: new Date().toLocaleDateString('zh-CN') }];
  saveAccounts(def);
  return def;
}
function saveAccounts(list) {
  localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(list));
}
function findAccount(user) {
  return getAccounts().find(a => a.user === user);
}

function checkAuth() {
  const s = sessionStorage.getItem(SESSION_KEY);
  return s === '1';
}

function showAdmin(user) {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('adminApp').style.display = 'block';
  sessionStorage.setItem('hanjiari_admin_user', user);
  if (user) document.getElementById('loginName').textContent = '👤 ' + user;
  render();
  renderAccounts();
}

function showLogin() {
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('adminApp').style.display = 'none';
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  showLogin();
  document.getElementById('loginPass').value = '';
}

// 登录表单：查账号列表
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  const acc = findAccount(u);
  if (acc && acc.pass === p) {
    sessionStorage.setItem(SESSION_KEY, '1');
    err.textContent = '';
    showAdmin(u);
  } else {
    err.textContent = '❌ 账号或密码错误';
    document.getElementById('loginPass').value = '';
  }
});

// 启动：检查会话
if (checkAuth()) {
  showAdmin(sessionStorage.getItem('hanjiari_admin_user') || DEFAULT_USER);
} else {
  showLogin();
}

const KEY = 'hanjiari_inquiries';

// ===== 账号管理功能 =====
function toggleAccounts() {
  const panel = document.getElementById('accountsPanel');
  const show = panel.style.display === 'none';
  panel.style.display = show ? 'block' : 'none';
  if (show) renderAccounts();
}

function renderAccounts() {
  const list = getAccounts();
  // 现有账号列表
  const wrap = document.getElementById('accountList');
  const cur = sessionStorage.getItem('hanjiari_admin_user') || '';
  wrap.innerHTML = list.map(a => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid #f0ece4;border-radius:6px;margin-bottom:6px;font-size:13px;">
      <span>👤 ${esc(a.user)} <small style="color:#8a97a5;">创建于 ${esc(a.created || '-')}</small></span>
      <button class="del-btn" onclick="delAccount('${esc(a.user)}')" ${a.user === 'admin' ? 'disabled style="opacity:.4;cursor:not-allowed;"' : ''}>删除</button>
    </div>`).join('');
  // 修改密码下拉
  const sel = document.getElementById('pwdUser');
  sel.innerHTML = list.map(a => `<option value="${esc(a.user)}">${esc(a.user)}</option>`).join('');
}

function createAccount() {
  const u = document.getElementById('newUser').value.trim();
  const p = document.getElementById('newPass').value;
  const msg = document.getElementById('createMsg');
  if (!u || !p) { msg.style.color = '#c0392b'; msg.textContent = '❌ 用户名和密码不能为空'; return; }
  if (u.length < 3) { msg.style.color = '#c0392b'; msg.textContent = '❌ 用户名至少 3 个字符'; return; }
  if (p.length < 6) { msg.style.color = '#c0392b'; msg.textContent = '❌ 密码至少 6 位'; return; }
  if (findAccount(u)) { msg.style.color = '#c0392b'; msg.textContent = '❌ 该账号已存在'; return; }
  const list = getAccounts();
  list.push({ user: u, pass: p, created: new Date().toLocaleDateString('zh-CN') });
  saveAccounts(list);
  msg.style.color = '#1a7f37';
  msg.textContent = '✅ 账号 ' + u + ' 创建成功';
  document.getElementById('newUser').value = '';
  document.getElementById('newPass').value = '';
  renderAccounts();
}

function changePassword() {
  const u = document.getElementById('pwdUser').value;
  const p = document.getElementById('pwdNew').value;
  const msg = document.getElementById('pwdMsg');
  if (!p) { msg.style.color = '#c0392b'; msg.textContent = '❌ 新密码不能为空'; return; }
  if (p.length < 6) { msg.style.color = '#c0392b'; msg.textContent = '❌ 密码至少 6 位'; return; }
  const list = getAccounts();
  const acc = list.find(a => a.user === u);
  if (!acc) { msg.style.color = '#c0392b'; msg.textContent = '❌ 账号不存在'; return; }
  acc.pass = p;
  saveAccounts(list);
  msg.style.color = '#1a7f37';
  msg.textContent = '✅ 账号 ' + u + ' 密码已修改';
  document.getElementById('pwdNew').value = '';
}

function delAccount(u) {
  const list = getAccounts();
  if (list.length <= 1) { alert('至少保留一个账号'); return; }
  if (!confirm('确定删除账号 ' + u + '？')) return;
  const idx = list.findIndex(a => a.user === u);
  if (idx > -1) {
    list.splice(idx, 1);
    saveAccounts(list);
    renderAccounts();
  }
}

function getList() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
  catch (e) { return []; }
}
function saveList(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function render() {
  const list = getList();
  document.getElementById('totalCount').textContent = list.length;
  document.getElementById('statTotal').textContent = list.length;
  const today = new Date().toLocaleDateString('zh-CN');
  const todayCount = list.filter(x => x.time && x.time.includes(today)).length;
  document.getElementById('statToday').textContent = todayCount;
  const withPhone = list.filter(x => x.phone && x.phone.trim()).length;
  document.getElementById('statContact').textContent = withPhone;

  const wrap = document.getElementById('tableWrap');
  if (!list.length) {
    wrap.innerHTML = '<div class="empty"><div class="big">📭</div>暂无咨询记录<br>官网表单提交后会自动显示在这里</div>';
    return;
  }
  let rows = list.map((x, i) => `
    <tr>
      <td class="time">${esc(x.time)}</td>
      <td>${esc(x.contact)}</td>
      <td>${esc(x.company)}</td>
      <td>${esc(x.phone)}</td>
      <td>${esc(x.email)}</td>
      <td class="msg">${esc(x.message)}</td>
      <td><button class="del-btn" onclick="delItem(${i})">删除</button></td>
    </tr>`).join('');
  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>时间</th><th>联系人</th><th>公司名</th><th>电话</th>
        <th>邮箱</th><th>咨询内容</th><th>操作</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function delItem(idx) {
  if (!confirm('确定删除这条咨询？')) return;
  const list = getList();
  list.splice(idx, 1);
  saveList(list);
  render();
}

function clearAll() {
  const n = getList().length;
  if (!n) return;
  if (!confirm('确定清空全部 ' + n + ' 条咨询？此操作不可恢复！')) return;
  localStorage.removeItem(KEY);
  render();
}

function exportCSV() {
  const list = getList();
  if (!list.length) { alert('暂无数据可导出'); return; }
  const header = ['时间', '联系人', '公司名', '电话', '邮箱', '咨询内容', '语言'];
  const rows = list.map(x => [
    x.time, x.contact, x.company, x.phone, x.email,
    (x.message || '').replace(/\n/g, ' '), x.lang
  ]);
  const csv = '\uFEFF' + [header, ...rows].map(r =>
    r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')
  ).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '咨询记录_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

render();
</script>
</body>
</html>
